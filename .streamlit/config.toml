# 무채색(그레이스케일) — timeline 톤. 흰 베이스·검정 강조·회색 라인 (app.py CSS와 정렬)
[theme]
base = "light"
primaryColor = "#141414"              # 검정 강조
backgroundColor = "#F5F5F5"           # 연한 회색 배경
secondaryBackgroundColor = "#FFFFFF"  # 흰색 표면(사이드바·카드)
textColor = "#141414"                 # 잉크 텍스트
font = "sans serif"

[browser]
gatherUsageStats = false

[server]
headless = true
