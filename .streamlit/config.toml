# 화이트 베이스 · 강한 CTA(비비드 오렌지) — app.py CSS와 정렬
[theme]
base = "light"
primaryColor = "#FF6A2C"              # 강한 CTA(비비드 오렌지)
backgroundColor = "#FFFFFF"           # 흰색 배경
secondaryBackgroundColor = "#F4F6F8"  # 연한 그레이 표면(사이드바·카드)
textColor = "#1E2530"                 # 니어 블랙 텍스트
font = "sans serif"

[browser]
gatherUsageStats = false

[server]
headless = true
